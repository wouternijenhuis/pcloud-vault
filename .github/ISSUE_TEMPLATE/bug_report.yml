name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include passwords, recovery keys, tokens, your email address or real file names.** Security problems go through private reporting instead (see the link on the previous page).
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of Settings.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Installer, Portable exe, Built from source]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Private Vault\n2. Right-click a file\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error messages or screenshots
      description: Please remove anything personal first.
