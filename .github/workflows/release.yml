name: Release

# Publishes a release when a merge to main carries a new version in src-tauri/tauri.conf.json.
# Merges that keep the version only run the quick version check below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never interrupt a release that is being published

jobs:
  version:
    name: Check version
    # Releases come from main only, including manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: read
        name: Is this version unreleased?
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the tag and release
      id-token: write # sign build provenance
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # One command per step: a multi-line pwsh step only fails on its last command.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: pnpm --dir frontend test
      - name: Build app and installer
        run: pnpm build
      - name: Build recovery tool
        run: cargo build --release --locked -p vault-cli

      - name: Assemble release files
        shell: pwsh
        run: |
          # SHA256SUMS uses LF line endings so `sha256sum -c` works on every platform.
          $name = "pCloud-Vault-$env:VERSION-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory $stage | Out-Null
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item target/release/pcloud-vault.exe "$stage/pCloud Vault.exe"
          Copy-Item $installer.FullName "$stage/pCloud-Vault-$env:VERSION-setup.exe"
          Copy-Item target/release/vault-recovery.exe $stage
          Copy-Item README.md, LICENSE, SECURITY.md, CHANGELOG.md, docs/QUICKSTART.txt $stage
          Push-Location $stage
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ((Get-ChildItem -File | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name }) -join "`n") + "`n")
          Pop-Location
          $out = Join-Path $env:RUNNER_TEMP dist
          New-Item -ItemType Directory $out | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "$out/$name.zip"
          Copy-Item "$stage/pCloud-Vault-$env:VERSION-setup.exe" $out
          Push-Location $out
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ((Get-ChildItem -File | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name }) -join "`n") + "`n")
          Pop-Location
          "DIST=$out" >> $env:GITHUB_ENV

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.DIST }}/*.zip
            ${{ env.DIST }}/*-setup.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP notes.md
          $section = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -match "^\[?$([regex]::Escape($env:VERSION))\]?" } | Select-Object -First 1
          $body = if ($section) { ($section -split "`n", 2)[1].Trim() } else { "See CHANGELOG.md." }
          @"
          $body

          ### Download
          Get **pCloud-Vault-$env:VERSION-windows-x64.zip**: it contains the portable app, the installer, the recovery tool and a quick-start guide. Windows 11 x64. See QUICKSTART.txt inside the zip.

          ### Verify
          Compare SHA256SUMS.txt, or check that this build came from this repository:
          ``gh attestation verify pCloud-Vault-$env:VERSION-windows-x64.zip --repo $env:GITHUB_REPOSITORY``

          The executables are not code-signed yet, so Windows SmartScreen may show a warning on first start.
          "@ | Set-Content -Encoding utf8 $notes
          gh release create "v$env:VERSION" (Get-ChildItem $env:DIST -File).FullName --target $env:GITHUB_SHA --title "pCloud Vault $env:VERSION" --notes-file $notes
