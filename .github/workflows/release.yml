name: Release

# Publishes a release when a merge to main carries a new version in src-tauri/tauri.conf.json.
# Merges that keep the version only run the quick version check below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never interrupt a release that is being published

jobs:
  version:
    name: Check version
    # Releases come from main only, including manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: read
        name: Is this version unreleased?
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-22.04 # oldest supported runner: the widest glibc compatibility
          - platform: macos-universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: pCloud-Vault-${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev patchelf libfuse2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # One command per step: a multi-line pwsh step only fails on its last command.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: pnpm --dir frontend test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - name: Build recovery tool (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p vault-cli
      - name: Stage files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP $env:NAME
          New-Item -ItemType Directory $stage | Out-Null
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item target/release/pcloud-vault.exe "$stage/pCloud Vault.exe"
          Copy-Item $installer.FullName "$stage/pCloud-Vault-$env:VERSION-setup.exe"
          Copy-Item target/release/vault-recovery.exe $stage
          Copy-Item README.md, LICENSE, SECURITY.md, CHANGELOG.md, docs/QUICKSTART.txt $stage
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$env:NAME.zip"
          Copy-Item "$stage/pCloud-Vault-$env:VERSION-setup.exe" dist/

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb
      - name: Build recovery tool (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p vault-cli
      - name: Stage files (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/$NAME"
          mkdir -p "$stage" dist
          cp target/release/bundle/appimage/*.AppImage "dist/$NAME.AppImage"
          cp target/release/bundle/deb/*.deb "dist/$NAME.deb"
          cp "dist/$NAME.AppImage" "$stage/pCloud-Vault.AppImage"
          chmod +x "$stage/pCloud-Vault.AppImage"
          cp target/release/vault-recovery README.md LICENSE SECURITY.md CHANGELOG.md docs/QUICKSTART.txt "$stage/"
          tar -C "$RUNNER_TEMP" -czf "dist/$NAME.tar.gz" "$NAME"

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Build recovery tool (macOS Apple Silicon)
        if: runner.os == 'macOS'
        run: cargo build --release --locked -p vault-cli --target aarch64-apple-darwin
      - name: Build recovery tool (macOS Intel)
        if: runner.os == 'macOS'
        run: cargo build --release --locked -p vault-cli --target x86_64-apple-darwin
      - name: Stage files (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/$NAME"
          bundle=target/universal-apple-darwin/release/bundle
          mkdir -p "$stage" dist
          cp "$bundle"/dmg/*.dmg "dist/$NAME.dmg"
          ditto "$bundle/macos/pCloud Vault.app" "$stage/pCloud Vault.app"
          lipo -create -output "$stage/vault-recovery" target/aarch64-apple-darwin/release/vault-recovery target/x86_64-apple-darwin/release/vault-recovery
          cp README.md LICENSE SECURITY.md CHANGELOG.md docs/QUICKSTART.txt "$stage/"
          ditto -c -k --keepParent "$stage" "dist/$NAME.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and release
      id-token: write # sign build provenance
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($0 ~ "^## \\[?" v "\\]?") ; next }
            found' CHANGELOG.md)
          base="pCloud-Vault-$VERSION"
          cat > notes.md <<EOF
          ${body:-See CHANGELOG.md.}

          ### Download
          | Platform | File |
          | --- | --- |
          | Windows 11 x64 | **$base-windows-x64.zip** (portable app, installer and recovery tool) or **$base-setup.exe** |
          | Linux x64 | **$base-linux-x64.AppImage**, **$base-linux-x64.deb**, or **$base-linux-x64.tar.gz** (AppImage and recovery tool) |
          | macOS 11+ (Apple Silicon and Intel) | **$base-macos-universal.dmg**, or **$base-macos-universal.zip** (app and recovery tool) |

          See QUICKSTART.txt in each archive.

          ### Verify
          Check the files against SHA256SUMS.txt (\`sha256sum -c SHA256SUMS.txt --ignore-missing\`), or check that a file was built from this repository:
          \`gh attestation verify $base-linux-x64.AppImage --repo $GITHUB_REPOSITORY\`

          The apps are not code-signed yet. Windows SmartScreen may warn on first start. On macOS, open it once, then choose **Open Anyway** in System Settings → Privacy & Security (on macOS 14 and earlier, right-click the app and choose **Open**). Each update may ask again for Keychain access.
          EOF
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "pCloud Vault $VERSION" --notes-file notes.md
