[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Encrypted, immutable local vault and convergent replication core"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
hex = "0.4"
fs2 = "0.4"
hkdf = "0.13"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Already used by the desktop shell; provides write-through renames for durable commits.
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }
