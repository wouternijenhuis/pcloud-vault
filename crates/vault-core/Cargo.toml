[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Encrypted, immutable local vault and convergent replication core"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
fs2 = "0.4"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
