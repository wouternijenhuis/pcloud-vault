[package]
name = "pcloud-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
axum = "0.8"
chacha20poly1305 = "0.11"
hex = "0.4"
open = "5"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
url = "2"
zeroize = "1"

# Device-bound secret protection: DPAPI on Windows, a random device key in the
# system keyring (Keychain / Secret Service) sealing the data elsewhere.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }


[target.'cfg(not(windows))'.dependencies]
keyring = "4"
