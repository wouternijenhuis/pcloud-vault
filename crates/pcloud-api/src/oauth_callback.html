<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pCloud Vault — Connecting</title>
<style>body{font:16px system-ui,sans-serif;background:#f7f8fa;color:#19243c;display:grid;place-items:center;min-height:96vh;margin:0}main{max-width:420px;background:white;border:1px solid #e5e8ee;border-radius:24px;padding:44px;text-align:center;box-shadow:0 12px 60px #19243c08}svg{color:#6174d5}h1{font-size:24px;letter-spacing:-.6px}p{color:#6c7486;line-height:1.6}</style></head>
<body><main><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 10V7a6 6 0 0 1 12 0v3M5 10h14v11H5z"/><path d="M12 14v3"/></svg><h1>Connecting your pCloud</h1><p id="message">Return to pCloud Vault when sign-in finishes.</p></main>
<script nonce="SCRIPT_NONCE">(async()=>{const fragment=location.hash.slice(1);history.replaceState(null,'','/callback');const message=document.getElementById('message');if(!fragment){message.textContent='No sign-in response was received. Please connect again from pCloud Vault.';return;}try{const response=await fetch('/complete',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:fragment,cache:'no-store',credentials:'omit',redirect:'error'});message.textContent=response.ok?'Connected. You can close this tab and return to pCloud Vault.':'Sign-in could not be completed. Please try again in pCloud Vault.';}catch{message.textContent='Return to pCloud Vault to check whether sign-in completed.';}})();</script>
</body></html>
